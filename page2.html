  <h2></h2>
  <p>
    <button type="button" id="record">record</button>
    <button type="button" id="stopRecord" disabled>stop</button>
  </p>
  <p>
    <audio id="recordedAudio"></audio>        
  </p>

  <script> 
    navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream => {handlerFunction(stream)})

    function handlerFunction(stream) {
      rec = new MediaRecorder(stream);
      rec.ondataavailable = e => {
        audioChunks.push(e.data);
        if (rec.state == "inactive"){
          let blob = new Blob(audioChunks,{type:'audio/mp3'});
          recordedAudio.src = URL.createObjectURL(blob);
          recordedAudio.controls=true;
          recordedAudio.autoplay=true;
          sendData(blob)
          }
        }
      }
    
    function sendData(data) {}
      record.onclick = e => {
        record.disabled = true;
        record.style.backgroundColor = "Pink"
        stopRecord.disabled=false;
        audioChunks = [];
        rec.start();
        }
      stopRecord.onclick = e => {
        record.disabled = false;
        stopRecord.disabled=true;
        record.style.backgroundColor = "red"
        rec.stop();
        }
  </script>


<br>



</main>

<!-- master button -->
<button  id="playAllBtn" class="playAllBtn.button">play from start</button>
<button class="pause button" onclick="pauseBothAudios()">pause</button>
<button class="play button" onclick="playBothAudios()">play</button>


<script>
function playBothAudios() {
  const audio1 = document.querySelector('audio[src="music/backwards jono .wav"]');
  const audio2 = document.getElementById('recordedAudio');

  if (audio1) audio1.play();
  if (audio2) audio2.play();
}

function pauseBothAudios() {
  const audio1 = document.querySelector('audio[src="music/backwards jono .wav"]');
  const audio2 = document.getElementById('recordedAudio');

  if (audio1) audio1.pause();
  if (audio2) audio2.pause();
}

const playBtn = document.getElementById('playAllBtn');

playBtn.addEventListener('click', () => {
  const audio1 = document.querySelector('audio[src="music/backwards jono .wav"]');
  const audio2 = document.getElementById('recordedAudio');

  if (audio1) audio1.currentTime = 0;
  if (audio2) audio2.currentTime = 0;

  if (audio1) audio1.play();
  if (audio2) audio2.play();
});

</script>
