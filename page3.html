<script>


function makeDistortionCurve(k = 50) {
  const nSamples = 44100;
  const curve = new Float32Array(nSamples);
  if (!Number.isFinite(k) || k === 0) {
    for (let i = 0; i < nSamples; i++) {
      const x = (i * 2) / nSamples - 1;
      curve[i] = x;
    }
    return curve;
  }

  for (let i = 0; i < nSamples; i++) {
    const x = (i * 2) / nSamples - 1;
    curve[i] = Math.atan(k * x) / Math.atan(k);
  }
  return curve;
}

function encodeWav(audioBuffer) {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const format = 1;
  const bitDepth = 16;
  const bytesPerSample = bitDepth / 8;
  const blockAlign = numChannels * bytesPerSample;
  const dataLength = audioBuffer.length * blockAlign;
  const wavBuffer = new ArrayBuffer(44 + dataLength);
  const view = new DataView(wavBuffer);

  function writeString(offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataLength, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, format, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeString(36, 'data');
  view.setUint32(40, dataLength, true);

  let offset = 44;
  const channelData = [];
  for (let ch = 0; ch < numChannels; ch++) {
    channelData.push(audioBuffer.getChannelData(ch));
  }

  for (let i = 0; i < audioBuffer.length; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      let sample = Math.max(-1, Math.min(1, channelData[ch][i]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      sample = Math.max(-32768, Math.min(32767, Math.round(sample)));
      view.setInt16(offset, sample, true);
      offset += bytesPerSample;
    }
  }

  return wavBuffer;
}

async function exportCombinedMix() {
  const audioEls = [document.getElementById('backwardsjono'), document.getElementById('fileinput')].filter(Boolean);
  if (!audioEls.length) return;

  try {
    const buffers = await Promise.all(audioEls.map(async (audio) => {
      if (!audio.src) return null;

      const response = await fetch(audio.src);
      if (!response.ok) return null;

      const arrayBuffer = await response.arrayBuffer();
      const context = new (window.AudioContext || window.webkitAudioContext)();
      const decoded = await context.decodeAudioData(arrayBuffer.slice(0));
      await context.close();

      return { audio, decoded };
    }));

    const valid = buffers.filter(Boolean);
    if (!valid.length) return;

    const sampleRate = 44100;
    const maxLength = Math.max(...valid.map(({ decoded }) => decoded.length));
    const totalLength = Math.max(1, Math.ceil(maxLength));

    const offline = new OfflineAudioContext(2, totalLength, sampleRate);
    const master = offline.createGain();
    master.gain.value = 1;
    master.connect(offline.destination);

    valid.forEach(({ audio, decoded }) => {
      const source = offline.createBufferSource();
      source.buffer = decoded;
      source.playbackRate.value = Number.isFinite(audio.playbackRate) ? audio.playbackRate : 1;
      source.loop = false;

      const gain = offline.createGain();
      gain.gain.value = (Number.parseFloat(audio.volume) || 50) / 100;

      const filter = offline.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 16000;
      filter.Q.value = 1;

      const shaper = offline.createWaveShaper();
      const drive = Number.parseFloat(document.getElementById('driveRange')?.value || '0');
      shaper.curve = makeDistortionCurve(drive * 100);

      const convolver = offline.createConvolver();
      const convolverGain = offline.createGain();
      const delay = offline.createDelay(2);
      const delayGain = offline.createGain();

      const impulse = offline.createBuffer(2, sampleRate, sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const channel = impulse.getChannelData(ch);
        for (let i = 0; i < channel.length; i++) {
          channel[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * 1.5));
        }
      }
      convolver.buffer = impulse;
      convolverGain.gain.value = (Number.parseFloat(document.getElementById('reverbRange')?.value || '0')) * 0.5;
      delay.delayTime.value = Number.parseFloat(document.getElementById('delayRange')?.value || '0');
      delayGain.gain.value = delay.delayTime.value > 0 ? 0.35 : 0;

      source.connect(filter);
      filter.connect(shaper);
      shaper.connect(gain);
      gain.connect(master);

      source.connect(convolver);
      convolver.connect(convolverGain);
      convolverGain.connect(master);

      source.connect(delay);
      delay.connect(delayGain);
      delayGain.connect(master);

      source.start(0);
    });

    const rendered = await offline.startRendering();
    const wav = encodeWav(rendered);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my_creation.wav';
    document.body.appendChild(a);
    // Use dispatched click for broader compatibility
    a.dispatchEvent(new MouseEvent('click'));
    // remove via parent to support older browsers
    if (a.parentNode) a.parentNode.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (error) {
    console.error('Export failed:', error);
  }
}

const downloadBtn = document.getElementById('downloadBtn');
if (downloadBtn) {
  downloadBtn.addEventListener('click', exportCombinedMix);
}
</script>
