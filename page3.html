<script>

const backwardsjono = document.getElementById('backwardsjono');
const fileinput = document.getElementById('fileinput');

function playBothAudios() {
  if (backwardsjono) backwardsjono.play();
  if (fileinput) fileinput.play();
}

function pauseBothAudios() {
  if (backwardsjono) backwardsjono.pause();
  if (fileinput) fileinput.pause();
}

const playBtn = document.getElementById('playAllBtn');

playBtn.addEventListener('click', () => {
  if (backwardsjono) backwardsjono.currentTime = 0;
  if (fileinput) fileinput.currentTime = 0;

  if (backwardsjono) backwardsjono.play();
  if (fileinput) fileinput.play();
});

const context = new (window.AudioContext || window.webkitAudioContext)();


// file upload thing then play it
const audioupload = document.getElementById('fileInput');
audioupload.setAttribute('accept', 'audio/wav, audio/mpeg, audio/mp3, audio/ogg, audio/flac, audio/aac, audio/webm, audio/x-wav, audio/x-m4a');
audioupload.addEventListener('change', function() {
  const file = this.files[0];
  if (file) {
    const fileURL = URL.createObjectURL(file);
    const fileAudio = document.getElementById('fileinput');
    fileAudio.src = fileURL;
    fileAudio.play();
  }
});
const speedNode = context.createBufferSource();

const reverbNode = context.createConvolver();
const delayNode = context.createDelay();
const delayGain = context.createGain();
const gainNode = context.createGain();

const backwardsjonoElement = document.getElementById('backwardsjono');
const fileinputElement = document.getElementById('fileinput');

const convolver = context.createConvolver();
const wetGain = context.createGain();
const dryGain = context.createGain();
const pitchNode = context.createBiquadFilter();

delayNode.delayTime.value = 0;
delayGain.gain.value = 0;

if (fileinputElement) {
  const fileSource = context.createMediaElementSource(fileinputElement);
  fileSource.connect(context.destination);
  fileSource.connect(delayNode);
  delayNode.connect(delayGain);
  delayGain.connect(context.destination);
}

</script>

<script>

let audioCtx;
        let source;

        function initAudio() {
            if (audioCtx) return;
            
          
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            source.connect(audioCtx.destination);
        }

const speedSlider = document.getElementById('speedRange');
const speedValue = document.getElementById('speedValue');

const pitchSlider = document.getElementById('pitchRange');
const pitchValue = document.getElementById('pitchValue');

const reverbSlider = document.getElementById('reverbRange');
const reverbValue = document.getElementById('reverbValue');

const delaySlider = document.getElementById('delayRange');
const delayValue = document.getElementById('delayValue');


speedSlider.addEventListener('input', function() {
  const speed = parseFloat(speedSlider.value);
  speedValue.textContent = speed.toFixed(2);
  if (backwardsjono) backwardsjono.playbackRate = speed;
  if (fileinput) fileinput.playbackRate = speed;
});

pitchSlider.addEventListener('input', function() {
  const pitch = parseFloat(pitchSlider.value);
  pitchValue.textContent = pitch.toFixed(2);
  if (backwardsjono) {
    backwardsjono.playbackRate = pitch;
    backwardsjono.preservesPitch = false;
  }
  if (fileinput) {
    fileinput.playbackRate = pitch;
    fileinput.preservesPitch = false;
  }
});

reverbSlider.addEventListener('input', (e) => {
  const mix = parseFloat(e.target.value);
  reverbValue.textContent = `${Math.round(mix * 100)}%`;
  if (wetGain && dryGain && context) {
    wetGain.gain.setValueAtTime(1 - mix, context.currentTime);
    dryGain.gain.setValueAtTime(1 - mix, context.currentTime);
  }
});

if (delaySlider) {
  delaySlider.addEventListener('input', function() {
    const delay = parseFloat(delaySlider.value || 0);
    if (delayValue) {
      delayValue.textContent = delay.toFixed(2);
    }
    delayNode.delayTime.setValueAtTime(delay, context.currentTime);
    delayGain.gain.setValueAtTime(delay > 0 ? 0.2 : 0, context.currentTime);
    delayNode.delayTime.setValueAtTime(delay > 0 ? delay : 2, context.currentTime);
    gainNode.connect(delayNode);
    delayNode.connect(context.destination);
  });
}

wetGain.gain.setValueAtTime(50, context.currentTime);

backwardsjonoElement.addEventListener('play', () => {
  if (context.state === 'suspended') {
    context.resume();
  }
});

fileinputElement.addEventListener('play', () => {
  if (context.state === 'suspended') {
    context.resume();
  }
});





</script>
