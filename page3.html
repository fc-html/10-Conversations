const speedNode = context.createBufferSource();

const reverbNode = context.createConvolver();
const delayNode = context.createDelay();
const delayGain = context.createGain();
const gainNode = context.createGain();

const backwardsjonoElement = document.getElementById('backwardsjono');

const convolver = context.createConvolver();

const pitchNode = context.createBiquadFilter();

// live graph master and per-source nodes (created on demand)
let masterGain = context.createGain();
masterGain.gain.value = 1;
masterGain.connect(context.destination);

let liveBackSource = null;
let liveFileSource = null;
let liveBackGain = null;
let liveFileGain = null;

function connectMediaElement(element, whenCreatedCallback) {
  if (!element) return null;
  try {
    const srcNode = context.createMediaElementSource(element);
    const srcGain = context.createGain();
    srcGain.gain.value = element.volume || 1;

    // main chain: filter -> distortion -> per-source gain -> master
    const filt = context.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 16000;
    filt.Q.value = 1;

    srcNode.connect(filt);
    filt.connect(distortionNode);
    distortionNode.connect(srcGain);
    srcGain.connect(masterGain);

    // reverb branch
    srcNode.connect(convolver);
    convolver.connect(wetGain);
    wetGain.connect(masterGain);

    // delay branch
    srcNode.connect(delayNode);
    delayNode.connect(delayGain);
    delayGain.connect(masterGain);

    // call any post-creation hook
    if (whenCreatedCallback) whenCreatedCallback({ srcNode, srcGain });
    return { srcNode, srcGain };
  } catch (err) {
    console.warn('Could not create media source for element', err);
    return null;
  }
}

delayNode.delayTime.value = 0;
delayGain.gain.value = 0;

if (fileinputElement) {
  const fileSource = context.createMediaElementSource(fileinputElement);
  fileSource.connect(context.destination);
  fileSource.connect(delayNode);
  delayNode.connect(delayGain);
  delayGain.connect(context.destination);
}

function makeDistortionCurve(k = 50) {
  const n_samples = 44100;
  const curve = new Float32Array(n_samples);
  for (let i = 0; i < n_samples; i++) {
    const x = (i * 2) / n_samples - 1;
    curve[i] = (Math.atan(k * x) / Math.atan(k));
  }
  return curve;
}

<script>

function makeDistortionCurve(k = 50) {
  const nSamples = 44100;
  const curve = new Float32Array(nSamples);
  if (!Number.isFinite(k) || k === 0) {
    for (let i = 0; i < nSamples; i++) {
      const x = (i * 2) / nSamples - 1;
      curve[i] = x;
    }
    return curve;
  }

  for (let i = 0; i < nSamples; i++) {
    const x = (i * 2) / nSamples - 1;
    curve[i] = Math.atan(k * x) / Math.atan(k);
  }
  return curve;
}

function encodeWav(audioBuffer) {
  const numChannels = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const format = 1;
  const bitDepth = 16;
  const bytesPerSample = bitDepth / 8;
  const blockAlign = numChannels * bytesPerSample;
  const dataLength = audioBuffer.length * blockAlign;
  const wavBuffer = new ArrayBuffer(44 + dataLength);
  const view = new DataView(wavBuffer);

  const writeString = (offset, string) => {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  };

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataLength, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, format, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeString(36, 'data');
  view.setUint32(40, dataLength, true);

  const channelData = [];
  for (let ch = 0; ch < numChannels; ch++) {
    channelData.push(audioBuffer.getChannelData(ch));
  }

  let offset = 44;
  for (let i = 0; i < audioBuffer.length; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const channel = channelData[ch];
      let sample = Math.max(-1, Math.min(1, channel[i]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      sample = Math.max(-32768, Math.min(32767, Math.round(sample)));
      view.setInt16(offset, sample, true);
      offset += bytesPerSample;
    }
  }

  return wavBuffer;
}

async function exportCombinedMix() {
  const mainTrack = document.getElementById('backwardsjono');
  const uploadedTrack = document.getElementById('fileinput');
  const fileInput = document.getElementById('fileInput');

  const tracks = [];

  if (mainTrack && (mainTrack.src || mainTrack.currentSrc)) {
    tracks.push({
      key: 'main',
      el: mainTrack,
      volume: Number.parseFloat(document.getElementById('volumeslider1')?.value || '50') / 100,
      src: mainTrack.currentSrc || mainTrack.src
    });
  }

  if (uploadedTrack && (uploadedTrack.src || uploadedTrack.currentSrc)) {
    tracks.push({
      key: 'upload',
      el: uploadedTrack,
      volume: Number.parseFloat(document.getElementById('volumeslider2')?.value || '50') / 100,
      src: uploadedTrack.currentSrc || uploadedTrack.src
    });
  }

  if (fileInput && fileInput.files && fileInput.files.length) {
    tracks.push({
      key: 'file',
      el: fileInput,
      volume: Number.parseFloat(document.getElementById('volumeslider2')?.value || '50') / 100,
      file: fileInput.files[0]
    });
  }

  if (!tracks.length) {
    alert('Add a track first, then click download.');
    return;
  }

  try {
    const decodedList = await Promise.all(tracks.map(async (track) => {
      try {
        let arrayBuffer;
        let decoded;

        if (track.file) {
          arrayBuffer = await track.file.arrayBuffer();
        } else if (track.src) {
          const resp = await fetch(track.src);
          if (!resp.ok) return null;
          arrayBuffer = await resp.arrayBuffer();
        } else {
          return null;
        }

        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        const decodingCtx = new AudioCtor();
        decoded = await decodingCtx.decodeAudioData(arrayBuffer.slice(0));
        await decodingCtx.close();

        return {
          decoded,
          volume: Number.isFinite(track.volume) && track.volume > 0 ? track.volume : 0.5
        };
      } catch (error) {
        console.warn('Could not decode track for export:', error);
        return null;
      }
    }));

    const valid = decodedList.filter(Boolean);
    if (!valid.length) {
      alert('The selected audio could not be loaded. Try choosing a file or reloading the page.');
      return;
    }

    const sampleRate = Math.max(...valid.map(({ decoded }) => decoded.sampleRate), 44100);
    const maxFrames = Math.max(...valid.map(({ decoded }) => decoded.length));
    const offline = new OfflineAudioContext(2, Math.max(1, Math.ceil(maxFrames)), sampleRate);
    const master = offline.createGain();
    master.gain.value = 1;
    master.connect(offline.destination);

    const driveValue = Number.parseFloat(document.getElementById('driveRange')?.value || '0');
    const reverbValue = Number.parseFloat(document.getElementById('reverbRange')?.value || '0');
    const delayValue = Number.parseFloat(document.getElementById('delayRange')?.value || '0');

    valid.forEach(({ decoded, volume }) => {
      const source = offline.createBufferSource();
      source.buffer = decoded;
      source.loop = false;

      const gain = offline.createGain();
      gain.gain.value = volume;

      const filter = offline.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 16000;
      filter.Q.value = 1;

      const shaper = offline.createWaveShaper();
      shaper.curve = makeDistortionCurve(driveValue * 100);

      const convolver = offline.createConvolver();
      const convolverGain = offline.createGain();
      convolverGain.gain.value = reverbValue * 0.5;

      const delay = offline.createDelay(2);
      const delayGain = offline.createGain();
      delay.delayTime.value = delayValue;
      delayGain.gain.value = delayValue > 0 ? 0.35 : 0;

      const impulse = offline.createBuffer(2, sampleRate, sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const channel = impulse.getChannelData(ch);
        for (let i = 0; i < channel.length; i++) {
          channel[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * 1.5));
        }
      }
      convolver.buffer = impulse;

      source.connect(filter);
      filter.connect(shaper);
      shaper.connect(gain);
      gain.connect(master);

      source.connect(convolver);
      convolver.connect(convolverGain);
      convolverGain.connect(master);

      source.connect(delay);
      delay.connect(delayGain);
      delayGain.connect(master);

      source.start(0);
    });

    const rendered = await offline.startRendering();
    const wavBuffer = encodeWav(rendered);
    const blob = new Blob([wavBuffer], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my_creation.wav';
    a.style.display = 'none';
    document.body.appendChild(a);

    try {
      a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    } catch (err) {
      a.click();
    }

    setTimeout(() => {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  } catch (err) {
    console.error('Error exporting mix:', err);
    alert('Error exporting mix: ' + (err && err.message ? err.message : 'unknown error'));
  }
}

const downloadBtn = document.getElementById('downloadBtn');
if (downloadBtn) {
  downloadBtn.addEventListener('click', (event) => {
    event.preventDefault();
    exportCombinedMix();
  });
}
